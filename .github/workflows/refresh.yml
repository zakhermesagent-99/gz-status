name: Refresh Gz status data
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean data.json from upstream feed
        env:
          UPSTREAM_RSS: ${{ secrets.UPSTREAM_RSS }}
        run: |
          set -e
          export UPSTREAM_BASE="${UPSTREAM_RSS%/feed.rss}"
          curl -sL --max-time 30 -H "User-Agent: gz-status/2.0" "$UPSTREAM_RSS" -o feed.rss
          python3 build_data.py
          rm -f feed.rss

      - name: Commit data.json if changed
        run: |
          set -e
          git config user.name "gz-status-bot"
          git config user.email "gz-status-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "status refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
