<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gz — وضعیت سرویس</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --bg:#0b0f17; --card:#121826; --border:#1f2937;
    --text:#e5e7eb; --muted:#9ca3af;
    --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --info:#3b82f6;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:Vazirmatn,Tahoma,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
  .logo{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:19px;color:#fff;
  }
  .brand h1{font-size:20px;margin:0}
  .brand small{color:var(--muted)}
  time{color:var(--muted);font-size:12px}

  .overall{
    border:1px solid var(--border); background:var(--card);
    border-radius:16px; padding:18px 20px; margin-bottom:22px;
    display:flex; align-items:center; gap:14px;
  }
  .dot{width:14px;height:14px;border-radius:50%;flex:none;animation:pulse 2s infinite}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .overall h2{margin:0;font-size:16px;font-weight:700}
  .overall p{margin:2px 0 0;color:var(--muted);font-size:13px}

  .card{
    border:1px solid var(--border); background:var(--card);
    border-radius:16px; padding:16px 18px; margin-bottom:14px;
  }
  .incident{cursor:pointer;transition:border-color .15s}
  .incident:hover{border-color:#374151}
  .incident-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .incident-head h3{margin:0;font-size:15px;font-weight:700}
  .badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid}
  .badge.resolved{color:var(--ok);border-color:var(--ok)}
  .badge.monitoring{color:var(--warn);border-color:var(--warn)}
  .badge.investigating,.badge.identified{color:var(--bad);border-color:var(--bad)}
  .msg{color:var(--text);font-size:14px;line-height:2;margin:12px 0 10px;white-space:pre-line}
  .comps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .comp{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:3px 9px}
  .comp b{color:var(--text);font-weight:600}
  .more{color:#a78bfa;font-size:13px}

  /* detail */
  .back{
    display:inline-flex;align-items:center;gap:6px;color:#a78bfa;cursor:pointer;
    font-size:14px;margin-bottom:14px;
  }
  .detail-title{font-size:18px;font-weight:800;margin:0 0 6px}
  .section{font-size:14px;font-weight:700;margin:22px 0 10px}

  /* chart */
  .chart{margin-bottom:18px}
  .chart-label{font-size:13px;font-weight:600;margin-bottom:6px}
  .bar{position:relative;height:22px;border-radius:6px;overflow:hidden;background:#0d1320;border:1px solid var(--border)}
  .seg{position:absolute;top:0;height:100%}
  .seg.op{background:var(--ok)} .seg.dp{background:var(--warn)}
  .seg.po{background:var(--bad)} .seg.fo{background:var(--bad)}
  .seg.mt{background:var(--info)}
  .bar-times{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:3px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px;color:var(--muted);font-size:12px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .sw.op{background:var(--ok)} .sw.dp{background:var(--warn)}
  .sw.po{background:var(--bad)} .sw.mt{background:var(--info)}

  /* timeline */
  .tl{position:relative;padding-right:20px}
  .tl::before{content:"";position:absolute;right:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
  .tl-item{position:relative;margin-bottom:18px}
  .tl-item::before{
    content:"";position:absolute;right:-20px;top:5px;width:11px;height:11px;border-radius:50%;
  }
  .tl-item.t-resolved::before{background:var(--ok)}
  .tl-item.t-monitoring::before{background:var(--warn)}
  .tl-item.t-investigating::before,.tl-item.t-identified::before{background:var(--bad)}
  .tl-status{font-weight:700;font-size:14px}
  .tl-msg{font-size:13.5px;line-height:2;margin:5px 0}
  .tl-time{color:var(--muted);font-size:12px}
  .tl-comps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12px}
  .skeleton{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:18px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" onclick="location.hash=''">
      <div class="logo">Gz</div>
      <div>
        <h1>Gz</h1>
        <small>وضعیت سرویس</small>
      </div>
    </div>
    <time id="updated"></time>
  </header>

  <div id="view"><div class="skeleton">در حال دریافت اطلاعات…</div></div>

  <footer>برای اطلاع از وضعیت سرویس، همین صفحه را به‌روز نگه دارید.</footer>
</div>

<script>
const OVERALL_OK = "همه سرویس‌ها فعال هستند";
const OVERALL_OK_SUB = "در حال حاضر هیچ اختلالی گزارش نشده است";
const OVERALL_BAD = "اختلال در سرویس‌ها";
const OVERALL_BAD_SUB = "یک یا چند سرویس با مشکل مواجه هستند — جزئیات در پایین";
let DATA = null;

function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML;}
function badge(s){return `<span class="badge ${esc((s||"").toLowerCase())}">${esc(s)}</span>`;}
function cls(st){
  const k=(st||"").toLowerCase().trim();
  if(k==="operational") return "op";
  if(k==="degraded performance") return "dp";
  if(k==="partial outage") return "po";
  if(k==="full outage") return "fo";
  if(k==="maintenance") return "mt";
  return "op";
}

function hhmm(iso){try{return new Date(iso).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});}catch(e){return ""}}
function fullt(iso){try{return new Date(iso).toLocaleString("fa-IR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return ""}}

async function load(){
  try{
    const r = await fetch("data.json", {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    DATA = await r.json();
    document.getElementById("updated").textContent =
      "آخرین بررسی: " + new Date(DATA.updated_at).toLocaleString("fa-IR");
    route();
  }catch(e){
    document.getElementById("view").innerHTML =
      '<div class="skeleton">دریافت اطلاعات ناموفق بود — صفحه را دوباره باز کنید</div>';
  }
}

function renderHome(){
  const active = DATA.incidents.find(i => i.status !== "resolved");
  const dot = active ? "bad" : "ok";
  let html = `
  <div class="overall">
    <div class="dot ${dot}"></div>
    <div>
      <h2>${active?OVERALL_BAD:OVERALL_OK}</h2>
      <p>${active?OVERALL_BAD_SUB:OVERALL_OK_SUB}</p>
    </div>
  </div>`;
  if(!DATA.incidents.length){
    html += '<div class="skeleton">هنوز حادثه‌ای ثبت نشده است ✅</div>';
  } else {
    html += DATA.incidents.map(i => `
    <div class="card incident" onclick="location.hash='#/inc/${esc(i.id)}'">
      <div class="incident-head">
        <h3>${esc(i.title)}</h3>
        ${badge(i.status_fa)}
      </div>
      <div class="msg">${esc(i.message)}</div>
      ${(i.components||[]).length?`<div class="comps">${i.components.map(c=>
        `<span class="comp"><b>${esc(c.name_fa)}</b> — ${esc(c.status_fa)}</span>`).join("")}</div>`:""}
      <div style="display:flex;justify-content:space-between;align-items:center">
        <time>⏱ ${esc(fullt(i.published_at))}</time>
        <span class="more">جزئیات و تایم‌لاین ←</span>
      </div>
    </div>`).join("");
  }
  document.getElementById("view").innerHTML = html;
}

function renderDetail(id){
  const i = DATA.incidents.find(x => x.id === id);
  if(!i){ renderHome(); return; }

  let chartsHtml = "";
  if((i.charts||[]).length){
    chartsHtml = `<div class="section">وضعیت سرورها در طول حادثه</div>
    <div class="legend">
      <span><i class="sw op"></i> فعال</span>
      <span><i class="sw dp"></i> کاهش عملکرد</span>
      <span><i class="sw po"></i> قطعی</span>
    </div>` + i.charts.map(c => {
      const t0 = new Date(c.start).getTime(), t1 = new Date(c.end).getTime();
      const span = Math.max(t1 - t0, 1);
      const segs = c.segments.map(s => {
        const a = new Date(s.start).getTime(), b = new Date(s.end).getTime();
        const left = ((a - t0) / span) * 100;
        const width = Math.max(((b - a) / span) * 100, 0.5);
        const k = cls(s.status);
        const tip = `${s.status_fa} — ${hhmm(s.start)} تا ${hhmm(s.end)}`;
        return `<div class="seg ${k}" style="right:${left}%;width:${width}%" title="${esc(tip)}"></div>`;
      }).join("");
      return `<div class="chart">
        <div class="chart-label">${esc(c.name_fa)}</div>
        <div class="bar">${segs}</div>
        <div class="bar-times"><span>${hhmm(c.start)}</span><span>${hhmm(c.end)}</span></div>
      </div>`;
    }).join("");
  }

  let tlHtml = "";
  if((i.updates||[]).length){
    const asc = [...i.updates].reverse(); // oldest first
    tlHtml = `<div class="section">روند رسیدگی</div><div class="tl">` + asc.map(u => `
      <div class="tl-item t-${esc(u.status)}">
        <div class="tl-status">${esc(u.status_fa)}</div>
        <div class="tl-msg">${esc(u.message)}</div>
        ${(u.components||[]).length?`<div class="tl-comps">${u.components.map(c=>
          `<span class="comp"><b>${esc(c.name_fa)}</b> — ${esc(c.status_fa)}</span>`).join("")}</div>`:""}
        <div class="tl-time">⏱ ${esc(fullt(u.published_at))}</div>
      </div>`).join("") + `</div>`;
  }

  document.getElementById("view").innerHTML = `
    <div class="back" onclick="location.hash=''">→ بازگشت به وضعیت کلی</div>
    <div class="card">
      <div class="incident-head">
        <h3 class="detail-title">${esc(i.title)}</h3>
        ${badge(i.status_fa)}
      </div>
      <div class="msg">${esc(i.message)}</div>
      ${(i.components||[]).length?`<div class="comps">${i.components.map(c=>
        `<span class="comp"><b>${esc(c.name_fa)}</b> — ${esc(c.status_fa)}</span>`).join("")}</div>`:""}
      <time>⏱ آخرین به‌روزرسانی: ${esc(fullt(i.published_at))}</time>
    </div>
    ${chartsHtml}
    ${tlHtml}`;
}

function route(){
  const h = location.hash || "";
  const m = h.match(/^#\/inc\/(.+)$/);
  if(m && DATA){ renderDetail(decodeURIComponent(m[1])); }
  else if(DATA){ renderHome(); }
}
window.addEventListener("hashchange", route);
load();
setInterval(load, 60_000);
</script>
</body>
</html>
